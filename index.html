<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Cat FX Edition</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      white-space: nowrap;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="cat-level-btn" onclick="toggleCatLevel()">Cats: LV.3</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">MODEL LOADING...</span> | LUXURY CAT FX
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズーム ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- Canvasリサイズ ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 猫の出現量 5段階コントロール (LV1 ~ LV5) ---
    let catLevel = 3; // デフォルト LV3
    function toggleCatLevel() {
      catLevel = (catLevel % 5) + 1;
      document.getElementById('cat-level-btn').textContent = `Cats: LV.${catLevel}`;
    }

    // --- 猫 & 肉球システム設定 ---
    let activeCats = [];
    let pawPrints = [];
    let lastInvasionTime = Date.now();
    let isInvading = false;
    let invasionStartTime = 0;

    const CAT_COLORS = [
      { body: '#2C2C2E', inner: '#E4C38B', eye: '#E4C38B' }, // Luxury Black
      { body: '#F7F3ED', inner: '#FFD1DC', eye: '#87CEEB' }, // Platinum White
      { body: '#D8C4B6', inner: '#FFF',    eye: '#90EE90' }, // Champagne Gold
      { body: '#8E8E93', inner: '#FFD1DC', eye: '#FFD700' }  // Silver Tabby
    ];

    // 新しい猫の生成
    function createCat(index, total) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const type = index % 3; // 0: 下からひょっこり, 1: 左から横切り, 2: 右から横切り
      const colorScheme = CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)];

      let startX, startY, targetX, targetY, exitX, exitY;
      const size = Math.random() * 25 + 55;

      if (type === 0) {
        // 下から顔を出す
        startX = (w / (total + 1)) * (index + 1) + (Math.random() * 40 - 20);
        startY = h + size;
        targetX = startX;
        targetY = h - size * 0.8;
        exitX = startX;
        exitY = h + size;
      } else if (type === 1) {
        // 左から右へ
        startX = -size * 2;
        startY = h * 0.4 + (Math.random() * h * 0.4);
        targetX = w * 0.3 + (index * 40);
        targetY = startY;
        exitX = w + size * 2;
        exitY = startY;
      } else {
        // 右から左へ
        startX = w + size * 2;
        startY = h * 0.4 + (Math.random() * h * 0.4);
        targetX = w * 0.7 - (index * 40);
        targetY = startY;
        exitX = -size * 2;
        exitY = startY;
      }

      return {
        x: startX,
        y: startY,
        startX, startY,
        targetX, targetY,
        exitX, exitY,
        size,
        color: colorScheme,
        type,
        pawTimer: 0,
        bobPhase: Math.random() * Math.PI * 2
      };
    }

    // 猫のプログラマティブ描画
    function drawCat(ctx, cat, opacity) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(cat.x, cat.y);

      const s = cat.size;
      const c = cat.color;

      // 頭部
      ctx.fillStyle = c.body;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();

      // 耳 (左)
      ctx.beginPath();
      ctx.moveTo(-s * 0.7, -s * 0.5);
      ctx.lineTo(-s * 0.9, -s * 1.3);
      ctx.lineTo(-s * 0.2, -s * 0.8);
      ctx.closePath();
      ctx.fillStyle = c.body;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-s * 0.65, -s * 0.55);
      ctx.lineTo(-s * 0.82, -s * 1.18);
      ctx.lineTo(-s * 0.28, -s * 0.78);
      ctx.closePath();
      ctx.fillStyle = c.inner;
      ctx.fill();

      // 耳 (右)
      ctx.beginPath();
      ctx.moveTo(s * 0.7, -s * 0.5);
      ctx.lineTo(s * 0.9, -s * 1.3);
      ctx.lineTo(s * 0.2, -s * 0.8);
      ctx.closePath();
      ctx.fillStyle = c.body;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(s * 0.65, -s * 0.55);
      ctx.lineTo(s * 0.82, -s * 1.18);
      ctx.lineTo(s * 0.28, -s * 0.78);
      ctx.closePath();
      ctx.fillStyle = c.inner;
      ctx.fill();

      // 目 (左・右)
      ctx.fillStyle = c.eye;
      ctx.beginPath();
      ctx.ellipse(-s * 0.35, -s * 0.1, s * 0.18, s * 0.25, 0, 0, Math.PI * 2);
      ctx.ellipse(s * 0.35, -s * 0.1, s * 0.18, s * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      // 瞳孔
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(-s * 0.35, -s * 0.1, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
      ctx.ellipse(s * 0.35, -s * 0.1, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // 鼻
      ctx.fillStyle = c.inner;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.15);
      ctx.lineTo(-s * 0.08, s * 0.08);
      ctx.lineTo(s * 0.08, s * 0.08);
      ctx.closePath();
      ctx.fill();

      // ヒゲ
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      // 左ヒゲ
      ctx.moveTo(-s * 0.3, s * 0.15); ctx.lineTo(-s * 1.1, s * 0.05);
      ctx.moveTo(-s * 0.3, s * 0.22); ctx.lineTo(-s * 1.0, s * 0.25);
      // 右ヒゲ
      ctx.moveTo(s * 0.3, s * 0.15); ctx.lineTo(s * 1.1, s * 0.05);
      ctx.moveTo(s * 0.3, s * 0.22); ctx.lineTo(s * 1.0, s * 0.25);
      ctx.stroke();

      ctx.restore();
    }

    // 肉球の描画
    function drawPaw(ctx, x, y, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;

      // メインパッド（掌球）
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      // 4本の指（指球）
      const toeOffset = size * 1.2;
      const toeSize = size * 0.45;
      const angles = [-Math.PI * 0.4, -Math.PI * 0.15, Math.PI * 0.15, Math.PI * 0.4];

      angles.forEach(angle => {
        const tx = x + Math.sin(angle) * toeOffset;
        const ty = y - Math.cos(angle) * toeOffset;
        ctx.beginPath();
        ctx.arc(tx, ty, toeSize, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // 肉球エフェクトの追加
    function addPawPrint(x, y) {
      pawPrints.push({
        x: x + (Math.random() * 60 - 30),
        y: y + (Math.random() * 60 - 30),
        size: Math.random() * 10 + 12,
        color: '#E4C38B', // ラグジュアリーゴールド
        alpha: 0.85,
        life: 1.0
      });
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      const now = Date.now();
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- 猫の乱入管理 (10秒ごとに発生、6秒間滞在) ---
      if (!isInvading && now - lastInvasionTime >= 10000) {
        isInvading = true;
        invasionStartTime = now;
        activeCats = [];

        // LVに合わせた猫の出現数 (LV1:1~2頭, LV5:7~8頭)
        const count = Math.min(10, Math.floor(catLevel * 1.5));
        for (let i = 0; i < count; i++) {
          activeCats.push(createCat(i, count));
        }
      }

      // 6秒経過したら退場処理完了
      if (isInvading && now - invasionStartTime >= 6000) {
        isInvading = false;
        lastInvasionTime = now;
        activeCats = [];
      }

      // 猫の更新と描画
      if (isInvading) {
        const elapsed = (now - invasionStartTime) / 1000; // 経過秒数 (0~6s)

        activeCats.forEach((cat) => {
          let currentX, currentY;

          if (elapsed < 1.5) {
            // 登場 (0s ~ 1.5s)
            const t = elapsed / 1.5;
            const easeT = 1 - Math.pow(1 - t, 3); // Ease Out
            currentX = cat.startX + (cat.targetX - cat.startX) * easeT;
            currentY = cat.startY + (cat.targetY - cat.startY) * easeT;
          } else if (elapsed < 4.5) {
            // アイドル・ひょっこり動作 (1.5s ~ 4.5s)
            const idleTime = elapsed - 1.5;
            currentX = cat.targetX + Math.sin(idleTime * 2 + cat.bobPhase) * 15;
            currentY = cat.targetY + Math.cos(idleTime * 3 + cat.bobPhase) * 8;

            // 時々肉球エフェクトを発生
            cat.pawTimer += 0.016;
            if (cat.pawTimer > 0.4 && Math.random() < 0.3) {
              addPawPrint(currentX, currentY - cat.size);
              cat.pawTimer = 0;
            }
          } else {
            // 退場 (4.5s ~ 6.0s)
            const t = (elapsed - 4.5) / 1.5;
            const easeT = Math.pow(t, 2); // Ease In
            currentX = cat.targetX + (cat.exitX - cat.targetX) * easeT;
            currentY = cat.targetY + (cat.exitY - cat.targetY) * easeT;
          }

          cat.x = currentX;
          cat.y = currentY;

          // 顔認識領域にある場合は透過度を下げる（顔を隠さない配慮）
          let opacity = 0.92;
          if (faces.length > 0) {
            for (const face of faces) {
              const { x, y, width, height } = face.box;
              if (cat.x > x - 20 && cat.x < x + width + 20 && cat.y > y - 20 && cat.y < y + height + 20) {
                opacity = 0.25;
                break;
              }
            }
          }

          drawCat(ctx, cat, opacity);
        });
      }

      // --- 肉球エフェクトの更新と描画 ---
      for (let i = pawPrints.length - 1; i >= 0; i--) {
        const p = pawPrints[i];
        p.life -= 0.02;
        p.alpha = p.life * 0.85;
        p.y -= 0.5; // ふわっと昇る

        if (p.life <= 0) {
          pawPrints.splice(i, 1);
        } else {
          drawPaw(ctx, p.x, p.y, p.size, p.color, p.alpha);
        }
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像を描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. 猫＆肉球エフェクト（Canvas）を重ねる
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPGで保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.9);
      const link = document.createElement('a');
      link.download = 'luxury_cat_ar_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    // 初期化
    initCamera();
  </script>
</body>
</html>
